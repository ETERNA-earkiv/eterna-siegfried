contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Lokal melange-byggd repo (genereras av `make package`)
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Nyckel genererad av `melange keygen`
    - melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - siegfried@local

accounts:
  groups:
    - groupname: siegfried
      gid: 1000
  users:
    - username: siegfried
      uid: 1000
      shell: /sbin/nologin
  run-as: "1000"

paths:
  - path: /data
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755

work-dir: /data

entrypoint:
  command: /usr/local/bin/sf-entrypoint

cmd: ""

archs:
  - x86_64
  - aarch64
